services:
  - type: web
    name: wfdiff-inference
    runtime: python
    rootDir: wfdiff-app/wfdiff-app/inference-space
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free
